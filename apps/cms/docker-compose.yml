services:
  postgres:
    image: postgres:17
    restart: always
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-payload}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payload}
      POSTGRES_DB: ${DB_NAME:-portfolio_site}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
