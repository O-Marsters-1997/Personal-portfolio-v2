name: Continuous Integration

on:
  push:
    branches:
      - "**"

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Resolve turbo base ref
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "TURBO_SCM_BASE=$BEFORE" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=origin/main" >> "$GITHUB_ENV"
          fi

      - name: Run linting
        run: bun turbo lint --affected
